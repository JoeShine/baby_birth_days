<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝 宝 天 数 计 算 器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #FFE74C;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background-image:
      radial-gradient(circle, #FF6B6B 2px, transparent 2px),
      radial-gradient(circle, #4ECDC4 3px, transparent 3px),
      radial-gradient(circle, #45B7D1 2px, transparent 2px);
    background-size: 60px 60px, 90px 90px, 80px 80px;
    background-position: 0 0, 30px 20px, 15px 45px;
  }

  .container {
    max-width: 440px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── 顶部徽章行 ── 极致压缩 */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 900;
    color: #000;
    letter-spacing: 1px;
  }
  .badge.pink { background: #FF6B6B; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }
  .badge.green { background: #4ECDC4; }
  .badge.blue  { background: #45B7D1; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }
  .badge .emoji { font-size: 18px; line-height: 1; }

  /* ── 输入卡片 ── 紧凑 */
  .input-card {
    background: #4ECDC4;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .input-card .icon-label {
    font-size: 32px;
    line-height: 1;
    flex-shrink: 0;
  }
  .input-card input[type="date"] {
    flex: 1;
    padding: 14px 16px;
    font-size: 20px;
    font-weight: 900;
    font-family: 'Noto Sans SC', sans-serif;
    text-align: center;
    border: 4px solid #000;
    box-shadow: 4px 4px 0 #000;
    background: #fff;
    color: #000;
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .input-card input[type="date"]:focus {
    box-shadow: 2px 2px 0 #000;
    transform: translate(2px, 2px);
  }

  /* ── 结果卡片 ── 主视觉区 */
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .result-card {
    background: #fff;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 32px 16px 24px;
    text-align: center;
  }
  .result-card.days {
    background: #FF6B6B;
  }
  .result-card.months {
    background: #45B7D1;
  }
  .result-card .label-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .result-card .label-icon {
    font-size: 26px;
    line-height: 1;
  }
  .result-card .label-text {
    font-size: 15px;
    font-weight: 900;
    color: #000;
    letter-spacing: 2px;
  }
  .result-card.days .label-text,
  .result-card.days .sub,
  .result-card.days .label-icon { color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.15); }
  .result-card.months .label-text,
  .result-card.months .sub,
  .result-card.months .label-icon { color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.15); }
  .result-card .value {
    font-size: 68px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    letter-spacing: -3px;
  }
  .result-card.days .value { color: #fff; }
  .result-card.months .value { color: #fff; }
  .result-card .unit {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin-top: 4px;
    opacity: 0.9;
  }
  .result-card .sub {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    margin-top: 6px;
    opacity: 0.75;
  }

  /* ── 里程碑 ── 紧凑横向 */
  .milestone-card {
    background: #fff;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 16px 14px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .milestone-card .milestone-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #FFE74C;
    border: 3px solid #000;
    box-shadow: 3px 3px 0 #000;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 900;
    color: #000;
    white-space: nowrap;
  }
  .milestone-card .milestone-tag.reached {
    background: #FF6B6B;
    color: #fff;
  }

  @media (max-width: 400px) {
    .result-card { padding: 24px 10px 18px; }
    .result-card .value { font-size: 50px; }
    .input-card { padding: 14px; gap: 8px; }
    .input-card input[type="date"] { font-size: 17px; padding: 12px; }
    .badge { font-size: 13px; padding: 5px 10px; }
    .milestone-tag { font-size: 11px; padding: 4px 8px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 顶部徽章行 - 极窄 -->
  <div class="top-bar">
    <span class="badge pink"><span class="emoji">👶</span> 宝宝天数</span>
    <span class="badge green"><span class="emoji">🍼</span> 计算器</span>
    <span class="badge blue"><span class="emoji">⭐</span> 记录成长</span>
  </div>

  <!-- 输入区 - 紧凑单行 -->
  <div class="input-card">
    <span class="icon-label">📅</span>
    <input type="date" id="birthdate" max="" placeholder="选择出生日期" />
  </div>

  <!-- 结果区 - 主视觉 -->
  <div class="results">
    <div class="result-card days">
      <div class="label-row">
        <span class="label-icon">📆</span>
        <span class="label-text">出生天数</span>
      </div>
      <div class="value" id="daysValue">—</div>
      <div class="unit">天</div>
      <div class="sub" id="weeksSub"></div>
    </div>
    <div class="result-card months">
      <div class="label-row">
        <span class="label-icon">📏</span>
        <span class="label-text">宝宝月龄</span>
      </div>
      <div class="value" id="monthsValue">—</div>
      <div class="unit">个月</div>
      <div class="sub" id="yearMonthSub"></div>
    </div>
  </div>

  <!-- 里程碑 - 紧凑标签行 -->
  <div class="milestone-card" id="milestoneRow">
    <!-- 动态生成 -->
  </div>

</div>

<script>
(function() {
  const birthdateInput = document.getElementById('birthdate');
  const daysValue = document.getElementById('daysValue');
  const weeksSub = document.getElementById('weeksSub');
  const monthsValue = document.getElementById('monthsValue');
  const yearMonthSub = document.getElementById('yearMonthSub');
  const milestoneRow = document.getElementById('milestoneRow');

  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  birthdateInput.setAttribute('max', todayStr);

  const milestones = [
    { days: 1,    label: '出生 🎂' },
    { days: 30,   label: '满月 🌕' },
    { days: 100,  label: '百天 💯' },
    { days: 180,  label: '半岁 🎈' },
    { days: 365,  label: '周岁 🎉' },
    { days: 730,  label: '两岁 🎊' },
  ];

  function renderMilestones(currentDays) {
    milestoneRow.innerHTML = milestones.map(m => {
      const reached = currentDays >= m.days;
      const cls = reached ? 'milestone-tag reached' : 'milestone-tag';
      return `<span class="${cls}">${m.label}</span>`;
    }).join('');
  }

  function updateDisplay() {
    const val = birthdateInput.value;
    if (!val) {
      daysValue.textContent = '—';
      weeksSub.textContent = '';
      monthsValue.textContent = '—';
      yearMonthSub.textContent = '';
      renderMilestones(0);
      return;
    }

    const birthDate = new Date(val + 'T00:00:00');
    const now = new Date();
    const msDiff = now.getTime() - birthDate.getTime();
    const rawDays = Math.floor(msDiff / (1000 * 60 * 60 * 24));

    // 出生当天算第 1 天
    const daysDiff = rawDays + 1;

    // 天数
    daysValue.textContent = daysDiff;
    const weeks = Math.floor(rawDays / 7);
    const remDays = rawDays % 7;
    weeksSub.textContent = weeks > 0 ? `约 ${weeks} 周 ${remDays} 天` : '今天出生 ✨';

    // 月龄
    const monthDiff = daysDiff / 30.4375;
    monthsValue.textContent = monthDiff.toFixed(1);

    // 年月日
    let totalRemaining = rawDays;
    const years = Math.floor(totalRemaining / 365);
    totalRemaining %= 365;
    const remMonths = Math.floor(totalRemaining / 30.4375);
    const remDaysFinal = totalRemaining - Math.floor(remMonths * 30.4375);

    let dateParts = [];
    if (years > 0) dateParts.push(`${years} 岁`);
    if (remMonths > 0) dateParts.push(`${remMonths} 个月`);
    dateParts.push(`${remDaysFinal + 1} 天`);
    yearMonthSub.textContent = dateParts.join(' ');

    renderMilestones(daysDiff);
  }

  birthdateInput.addEventListener('change', updateDisplay);
  birthdateInput.addEventListener('input', updateDisplay);

  // 恢复上次输入
  const saved = localStorage.getItem('baby_birthdate');
  if (saved) {
    birthdateInput.value = saved;
    updateDisplay();
  }

  birthdateInput.addEventListener('change', () => {
    if (birthdateInput.value) {
      localStorage.setItem('baby_birthdate', birthdateInput.value);
    }
  });

  // 每分钟刷新
  setInterval(updateDisplay, 60 * 1000);

  renderMilestones(0);
})();
</script>
</body>
</html>
