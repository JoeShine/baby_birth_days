<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝 宝 天 数 计 算 器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #FFE74C;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background-image:
      radial-gradient(circle, #FF6B6B 3px, transparent 3px),
      radial-gradient(circle, #4ECDC4 4px, transparent 4px),
      radial-gradient(circle, #45B7D1 3px, transparent 3px);
    background-size: 80px 80px, 120px 120px, 100px 100px;
    background-position: 10px 10px, 50px 60px, 30px 30px;
  }

  .container {
    max-width: 480px;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #FFE74C;
  }

  /* ── 顶部区域 80px ── */
  .top-bar {
    height: 80px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
  }
  .top-bar .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 900;
    color: #000;
    letter-spacing: 2px;
  }
  .top-bar .badge .emoji {
    font-size: 26px;
    line-height: 1;
  }

  /* ── 内容区 弹性撑满 ── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    overflow-y: auto;
  }

  /* ── 输入卡片 ── */
  .input-card {
    background: #4ECDC4;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .input-card .input-label {
    font-size: 16px;
    font-weight: 900;
    color: #000;
    letter-spacing: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .input-card input[type="date"] {
    flex: 1;
    padding: 14px 12px;
    font-size: 20px;
    font-weight: 900;
    font-family: 'Noto Sans SC', sans-serif;
    text-align: center;
    border: 4px solid #000;
    box-shadow: 4px 4px 0 #000;
    background: #fff;
    color: #000;
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .input-card input[type="date"]:focus {
    box-shadow: 2px 2px 0 #000;
    transform: translate(2px, 2px);
  }

  /* ── 结果区域 - 左右布局 ── */
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .result-card {
    background: #fff;
    border: 4px solid #000;
    box-shadow: 8px 8px 0 #000;
    padding: 30px 14px;
    text-align: center;
  }
  .result-card.days {
    background: #FF6B6B;
  }
  .result-card.months {
    background: #45B7D1;
  }
  .result-card .label-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .result-card .label-icon {
    font-size: 30px;
    line-height: 1;
  }
  .result-card .label-text {
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 3px;
  }
  .result-card.days .label-text,
  .result-card.days .label-icon { color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.15); }
  .result-card.months .label-text,
  .result-card.months .label-icon { color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.15); }
  .result-card .value {
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -4px;
  }
  .result-card.days .value { color: #fff; }
  .result-card.months .value { color: #fff; }
  .result-card .unit {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    margin-top: 6px;
    opacity: 0.9;
  }
  .result-card .sub {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-top: 8px;
    opacity: 0.75;
  }

  /* ── 里程碑 ── */
  .milestone-row {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 0;
  }
  .milestone-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #fff;
    border: 3px solid #000;
    box-shadow: 3px 3px 0 #000;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 900;
    color: #000;
    white-space: nowrap;
  }
  .milestone-tag.reached {
    background: #FF6B6B;
    color: #fff;
  }

  /* ── 祝福语 ── */
  .blessing {
    text-align: center;
    padding: 8px 0 4px;
  }
  .blessing .heart-line {
    font-size: 24px;
    letter-spacing: 6px;
    margin-bottom: 4px;
  }
  .blessing .bless-text {
    font-size: 16px;
    font-weight: 900;
    color: #000;
    letter-spacing: 2px;
    background: #fff;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    display: inline-block;
    padding: 10px 24px;
  }

  /* ── 响应式 ── */
  @media (max-width: 380px) {
    .result-card { padding: 18px 8px; }
    .result-card .value { font-size: 44px; }
    .result-card .label-text { font-size: 13px; letter-spacing: 1px; }
    .input-card input[type="date"] { font-size: 16px; padding: 10px 6px; }
    .input-card .input-label { font-size: 13px; letter-spacing: 1px; }
    .top-bar { height: 64px; min-height: 64px; }
    .top-bar .badge { font-size: 17px; }
    .content { padding: 12px; gap: 10px; }
  }
  @media (min-width: 420px) {
    .result-card { padding: 48px 24px; }
    .result-card .value { font-size: 96px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 顶部 80px -->
  <div class="top-bar">
    <span class="badge">
      <span class="emoji">👶</span> 宝宝天数计算器 <span class="emoji">🍼</span>
    </span>
  </div>

  <!-- 内容区 -->
  <div class="content">

    <!-- 输入区 -->
    <div class="input-card">
      <span class="input-label">📅 出生日期</span>
      <input type="date" id="birthdate" max="" />
    </div>

    <!-- 结果区 - 纵向 -->
    <div class="results">
      <div class="result-card days">
        <div class="label-row">
          <span class="label-icon">📆</span>
          <span class="label-text">出生天数</span>
        </div>
        <div class="value" id="daysValue">—</div>
        <div class="unit">天</div>
        <div class="sub" id="weeksSub"></div>
      </div>
      <div class="result-card months">
        <div class="label-row">
          <span class="label-icon">📏</span>
          <span class="label-text">宝宝月龄</span>
        </div>
        <div class="value" id="monthsValue">—</div>
        <div class="unit">个月</div>
        <div class="sub" id="yearMonthSub"></div>
      </div>
    </div>

    <!-- 里程碑 -->
    <div class="milestone-row" id="milestoneRow"></div>

    <!-- 祝福语 -->
    <div class="blessing">
      <div class="bless-text">💛 祝宝宝健康快乐成长 💛</div>
    </div>

  </div>

</div>

<script>
(function() {
  const birthdateInput = document.getElementById('birthdate');
  const daysValue = document.getElementById('daysValue');
  const weeksSub = document.getElementById('weeksSub');
  const monthsValue = document.getElementById('monthsValue');
  const yearMonthSub = document.getElementById('yearMonthSub');
  const milestoneRow = document.getElementById('milestoneRow');

  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  birthdateInput.setAttribute('max', todayStr);

  const milestones = [
    { days: 1,    label: '出生 🎂' },
    { days: 30,   label: '满月 🌕' },
    { days: 100,  label: '百天 💯' },
    { days: 180,  label: '半岁 🎈' },
    { days: 365,  label: '周岁 🎉' },
    { days: 730,  label: '两岁 🎊' },
  ];

  function renderMilestones(currentDays) {
    milestoneRow.innerHTML = milestones.map(m => {
      const reached = currentDays >= m.days;
      const cls = reached ? 'milestone-tag reached' : 'milestone-tag';
      return `<span class="${cls}">${m.label}</span>`;
    }).join('');
  }

  function updateDisplay() {
    const val = birthdateInput.value;
    if (!val) {
      daysValue.textContent = '—';
      weeksSub.textContent = '';
      monthsValue.textContent = '—';
      yearMonthSub.textContent = '';
      renderMilestones(0);
      return;
    }

    const birthDate = new Date(val + 'T00:00:00');
    const now = new Date();
    const msDiff = now.getTime() - birthDate.getTime();
    const rawDays = Math.floor(msDiff / (1000 * 60 * 60 * 24));

    // 出生当天算第 1 天
    const daysDiff = rawDays + 1;

    // 天数
    daysValue.textContent = daysDiff;
    const weeks = Math.floor(rawDays / 7);
    const remDays = rawDays % 7;
    if (daysDiff === 1) {
      weeksSub.textContent = '👋 今天出生 ✨';
    } else {
      weeksSub.textContent = weeks > 0 ? `约 ${weeks} 周 ${remDays} 天` : '';
    }

    // 月龄
    const monthDiff = daysDiff / 30.4375;
    monthsValue.textContent = monthDiff.toFixed(1);

    // 年月日
    let totalRemaining = rawDays;
    const years = Math.floor(totalRemaining / 365);
    totalRemaining %= 365;
    const remMonths = Math.floor(totalRemaining / 30.4375);
    const remDaysFinal = totalRemaining - Math.floor(remMonths * 30.4375);

    let dateParts = [];
    if (years > 0) dateParts.push(`${years} 岁`);
    if (remMonths > 0) dateParts.push(`${remMonths} 个月`);
    dateParts.push(`${remDaysFinal + 1} 天`);
    yearMonthSub.textContent = dateParts.join(' ');

    renderMilestones(daysDiff);
  }

  birthdateInput.addEventListener('change', updateDisplay);
  birthdateInput.addEventListener('input', updateDisplay);

  // 自动记忆：优先 localStorage，否则默认 2025-09-29
  const saved = localStorage.getItem('baby_birthdate');
  if (saved) {
    birthdateInput.value = saved;
  } else {
    birthdateInput.value = '2025-09-29';
  }
  updateDisplay();

  birthdateInput.addEventListener('change', () => {
    if (birthdateInput.value) {
      localStorage.setItem('baby_birthdate', birthdateInput.value);
    }
  });

  // 每分钟刷新
  setInterval(updateDisplay, 60 * 1000);
})();
</script>
</body>
</html>
